<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hide &amp; Seek Zone 1 — print sheet</title>
<style id="pagesize">@page { size: 297mm 210mm; margin: 0 }</style>
<style>
  body{margin:0;background:#e2e8f0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#0f172a}
  #bar{display:flex;gap:8px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #cbd5e1;position:sticky;top:0;z-index:2}
  #bar strong{margin-right:auto;font-size:15px}
  button{font:inherit;font-size:14px;font-weight:600;border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:9px;padding:7px 13px;cursor:pointer}
  button.active{background:#0f172a;color:#fff;border-color:#0f172a}
  #btn-print{background:#e11d48;color:#fff;border-color:#e11d48}
  #sheet{display:flex;justify-content:center;padding:20px;overflow:auto}
  .sheet{background:#fff;box-shadow:0 6px 24px rgba(15,23,42,.18);flex:0 0 auto}

  /* the sheet itself */
  .river{fill:none;stroke:#dbe4ec;stroke-linejoin:round;stroke-linecap:round}
  .ring{fill:#f8fafc;stroke:#475569;stroke-width:.22}
  .ring.dlr,.ring.rail,.ring.overground{stroke-dasharray:1.2 .9}
  .dot{fill:#0f172a}
  .labels text{fill:#0f172a;font-family:Helvetica,Arial,sans-serif;font-weight:600}
  .title{font:700 5px Helvetica,Arial,sans-serif;fill:#0f172a}
  .sub{font:2.4px Helvetica,Arial,sans-serif;fill:#64748b}
  .rule{stroke:#cbd5e1;stroke-width:.2}
  .bar{stroke:#0f172a;stroke-width:.3;fill:none}
  .leader{stroke:#94a3b8;stroke-width:.15}

  @media print{
    body{background:#fff}
    #bar{display:none}
    #sheet{padding:0}
    .sheet{box-shadow:none}
  }
</style>
</head>
<body>
<div id="bar">
  <strong>Printable sheet</strong>
  <span id="sizes"><button data-size="a4">A4</button> <button data-size="a3">A3</button></span>
  <button id="btn-print">Print</button>
</div>
<div id="sheet"></div>
<script src="data/stations.js?v=dev"></script>
<script src="data/thames.js?v=dev"></script>
<script src="js/print.js?v=dev"></script>
</body>
</html>
