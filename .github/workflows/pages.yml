name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true          # turns Pages on for the repo if it is off
      - name: Stamp asset URLs with the commit SHA
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .                   # static site, no build step
      - id: deployment
        uses: actions/deploy-pages@v4
