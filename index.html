<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f8fafc">
<title>Hide &amp; Seek — London Zone 1</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚇</text></svg>">
</head>
<body>

<header id="topbar">
  <h1>Hide &amp; Seek <span>Zone 1</span></h1>
  <div id="counter" title="Stations not yet crossed out">—</div>
</header>

<main>
  <!-- ---------------- MAP ---------------- -->
  <section class="panel active" id="panel-map">
    <div id="map"></div>

    <div id="search-wrap">
      <input id="search" type="search" placeholder="Find a station…" autocomplete="off" spellcheck="false">
      <ul id="search-results" hidden></ul>
    </div>

    <div id="map-buttons">
      <button id="btn-locate" title="Show my location">◎</button>
      <button id="btn-labels" title="Toggle station names">Aa</button>
      <button id="btn-reset" title="Restore all stations">↺</button>
    </div>

    <div id="legend">
      <label><input type="checkbox" id="filter-nontube"> Hide non-Underground</label>
    </div>
  </section>

  <!-- ---------------- RULES ---------------- -->
  <section class="panel" id="panel-rules">
    <div class="reading" id="rules-body"></div>
  </section>

  <!-- ---------------- QUESTIONS ---------------- -->
  <section class="panel" id="panel-questions">
    <div class="reading">
      <p class="lede">The printed pad's allowed questions, with a verdict on each for a Zone 1 board. Tap one to log it.</p>
      <div class="chips" id="q-filter">
        <button class="chip active" data-v="all">Everything</button>
        <button class="chip" data-v="live">Hide the dead options</button>
        <button class="chip" data-v="strong">Strong only</button>
      </div>
      <div id="questions-body"></div>
      <h2>Asked this round</h2>
      <ol id="asked-log"><li class="empty">Nothing asked yet.</li></ol>
      <button class="ghost" id="btn-clear-log">Clear the log</button>
    </div>
  </section>

  <!-- ---------------- DECK ---------------- -->
  <section class="panel" id="panel-deck">
    <div class="reading">
      <div class="deck-top">
        <div class="pile">
          <strong id="pile-count">0</strong><span>in pile</span>
        </div>
        <div class="deck-actions">
          <button id="btn-draw1">Draw 1</button>
          <button id="btn-draw2">Draw 2</button>
          <button id="btn-draw3">Draw 3</button>
          <button id="btn-draw4">Draw 4</button>
          <button class="ghost" id="btn-shuffle">Reshuffle</button>
        </div>
      </div>
      <div id="banked"></div>
      <h2>Hand <small id="hand-note"></small></h2>
      <div id="hand" class="cards"><p class="empty">Answer a question, then draw.</p></div>
      <h2>Every card in the deck</h2>
      <div class="chips" id="deck-filter">
        <button class="chip active" data-type="all">All</button>
        <button class="chip" data-type="time">Time</button>
        <button class="chip" data-type="power">Powerups</button>
        <button class="chip" data-type="curse">Curses</button>
      </div>
      <div id="reference" class="cards"></div>
    </div>
  </section>
</main>

<nav id="tabs">
  <button class="active" data-panel="map"><span>🗺️</span>Map</button>
  <button data-panel="rules"><span>📖</span>Rules</button>
  <button data-panel="questions"><span>❓</span>Questions</button>
  <button data-panel="deck"><span>🃏</span>Deck</button>
</nav>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="data/stations.js"></script>
<script src="data/rules.js"></script>
<script src="data/questions.js"></script>
<script src="data/deck.js"></script>
<script src="js/app.js"></script>
</body>
</html>
